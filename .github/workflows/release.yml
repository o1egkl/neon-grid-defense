name: Build & Release Neon Grid Defense

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    name: Build Web (HTML5)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/web
          HOME=/root godot --headless --import --quit || true

      - name: Export Web build
        run: HOME=/root godot --headless --verbose --export-release "Web" builds/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-defense-web
          path: builds/web

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    name: Build Windows (.exe)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/windows
          HOME=/root godot --headless --import --quit || true

      - name: Export Windows build
        run: HOME=/root godot --headless --verbose --export-release "Windows Desktop" builds/windows/NeonGridDefense.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-defense-windows
          path: builds/windows

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/linux
          HOME=/root godot --headless --import --quit || true

      - name: Export Linux build
        run: |
          HOME=/root godot --headless --verbose --export-release "Linux" builds/linux/NeonGridDefense.x86_64
          chmod +x builds/linux/NeonGridDefense.x86_64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-defense-linux
          path: builds/linux

  build-macos:
    name: Build macOS (Universal .zip)
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-heat project (.godot import cache)
        run: |
          mkdir -p builds/macos
          HOME=/root godot --headless --import --quit || true

      - name: Export macOS build
        run: HOME=/root godot --headless --verbose --export-release "macOS" builds/macos/NeonGridDefense-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-defense-macos
          path: builds/macos

  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare debug keystore & Android build template
        run: |
          export HOME=/root
          mkdir -p builds/android android/build
          if [ ! -f /root/debug.keystore ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore /root/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          sed -i 's|keystore/debug=""|keystore/debug="/root/debug.keystore"|g' export_presets.cfg
          sed -i 's|keystore/release=""|keystore/release="/root/debug.keystore"|g' export_presets.cfg
          sed -i 's|keystore/release_user=""|keystore/release_user="androiddebugkey"|g' export_presets.cfg
          sed -i 's|keystore/release_password=""|keystore/release_password="android"|g' export_presets.cfg
          TEMPLATE_DIR="/root/.local/share/godot/export_templates/4.3.stable"
          if [ -f "$TEMPLATE_DIR/android_source.zip" ]; then
            unzip -q -o "$TEMPLATE_DIR/android_source.zip" -d android/build
            echo "4.3.stable" > android/.build_version
            touch android/build/.gdignore
          fi
          SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Pre-heat project (.godot import cache)
        run: HOME=/root godot --headless --import --quit || true

      - name: Export Android Debug APK & Release AAB
        run: |
          HOME=/root godot --headless --verbose --export-debug "Android" builds/android/NeonGridDefense.apk
          HOME=/root godot --headless --verbose --export-release "Android AAB" builds/android/NeonGridDefense.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neon-grid-defense-android
          path: builds/android

  release:
    name: Create GitHub Release
    needs: [build-web, build-windows, build-linux, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Web & Linux ZIPs
        run: |
          (cd release-artifacts/neon-grid-defense-web && zip -r ../neon-grid-defense-web.zip .)
          (cd release-artifacts/neon-grid-defense-linux && zip -r ../NeonGridDefense-Linux-x86_64.zip .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            release-artifacts/neon-grid-defense-web.zip
            release-artifacts/neon-grid-defense-windows/NeonGridDefense.exe
            release-artifacts/NeonGridDefense-Linux-x86_64.zip
            release-artifacts/neon-grid-defense-macos/NeonGridDefense-macOS.zip
            release-artifacts/neon-grid-defense-android/NeonGridDefense.apk
            release-artifacts/neon-grid-defense-android/NeonGridDefense.aab
          generate_release_notes: true
